[package]
name = "nac3artiq"
version = "0.1.0"
authors = ["M-Labs"]
edition = "2024"

[lib]
name = "nac3artiq"
crate-type = ["cdylib"]

[dependencies]
indexmap = "2.8"
itertools = "0.14"
pyo3 = { version = "0.24", features = ["extension-module"] }
parking_lot = "0.12"
tempfile = "3.19"
nac3core = { path = "../nac3core" }
nac3ld = { path = "../nac3ld" }

[features]
init-llvm-profile = []
no-escape-analysis = ["nac3core/no-escape-analysis"]
