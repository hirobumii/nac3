[package]
name = "nac3core_derive"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[[test]]
name = "structfields_tests"
path = "tests/structfields_test.rs"

[dev-dependencies]
nac3core = { path = ".." }
trybuild = { version = "1.0", features = ["diff"] }

[dependencies]
proc-macro2 = "1.0"
proc-macro-error = "1.0"
syn = "2.0"
quote = "1.0"
