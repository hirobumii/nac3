[package]
name = "nac3core"
version = "0.1.0"
authors = ["M-Labs"]
edition = "2021"

[dependencies]
itertools = "0.13"
crossbeam = "0.8"
indexmap = "2.2"
parking_lot = "0.12"
rayon = "1.8"
nac3parser = { path = "../nac3parser" }
strum = "0.26.2"
strum_macros = "0.26.4"

[dependencies.inkwell]
version = "0.4"
default-features = false
features = ["llvm14-0", "target-x86", "target-arm", "target-riscv", "no-libffi-linking"]

[dev-dependencies]
test-case = "1.2.0"
indoc = "2.0"
insta = "=1.11.0"

[build-dependencies]
regex = "1.10"
