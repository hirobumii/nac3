[package]
name = "nac3parser"
version = "0.1.2"
description = "Parser for python code."
authors = [ "RustPython Team", "M-Labs" ]
build = "build.rs"
license = "MIT"
edition = "2021"

[build-dependencies]
lalrpop = "0.22"

[dependencies]
nac3ast = { path = "../nac3ast" }
lalrpop-util = "0.22"
log = "0.4"
unic-emoji-char = "0.9"
unic-ucd-ident  = "0.9"
unicode_names2 = "1.3"
phf = { version = "0.11", features = ["macros"] }
ahash = "0.8"

[dev-dependencies]
insta = "=1.11.0"
